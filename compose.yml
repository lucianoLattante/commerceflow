services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${CF_DB_NAME:-commerceflow}
      MYSQL_USER: ${CF_DB_USER:-commerceflow}
      MYSQL_PASSWORD: ${CF_DB_PASSWORD:?Run scripts/init-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${CF_DB_ROOT_PASSWORD:?Set a distinct root password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
  redis:
    image: redis:8.2.11
    user: redis
    read_only: true
    tmpfs: [/tmp]
    environment:
      REDIS_PASSWORD: ${CF_REDIS_PASSWORD:?Set an independent Redis password}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s\n' 'bind 0.0.0.0' 'protected-mode yes' 'save ""' 'appendonly no' "requirepass $$REDIS_PASSWORD" > /tmp/commerceflow-redis.conf
        exec redis-server /tmp/commerceflow-redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e ping']
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      CF_TOKEN_CLEANUP_ENABLED: ${CF_TOKEN_CLEANUP_ENABLED:-true}
      CF_TOKEN_CLEANUP_BATCH_SIZE: ${CF_TOKEN_CLEANUP_BATCH_SIZE:-200}
      CF_TOKEN_CLEANUP_INTERVAL_MS: ${CF_TOKEN_CLEANUP_INTERVAL_MS:-60000}
      CF_RATE_LIMIT_ENABLED: "true"
      CF_REDIS_HOST: redis
      CF_REDIS_PASSWORD: ${CF_REDIS_PASSWORD:?Set an independent Redis password}
      CF_MESSAGING_ENABLED: "true"
      CF_KAFKA_BOOTSTRAP: kafka:19092
      CF_DB_URL: jdbc:mysql://mysql:3306/${CF_DB_NAME:-commerceflow}?connectionTimeZone=UTC
      CF_DB_USER: ${CF_DB_USER:-commerceflow}
      CF_DB_PASSWORD: ${CF_DB_PASSWORD:?Set database password}
      CF_BOOTSTRAP_ADMIN_EMAIL: ${CF_BOOTSTRAP_ADMIN_EMAIL:?Set local bootstrap email}
      CF_BOOTSTRAP_ADMIN_PASSWORD: ${CF_BOOTSTRAP_ADMIN_PASSWORD:?Set local bootstrap password}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
volumes:
  mysql-data:
  kafka-data:
