spring:
  application:
    name: commerceflow
  datasource:
    url: ${CF_DB_URL:jdbc:mysql://127.0.0.1:3306/commerceflow?connectionTimeZone=UTC}
    username: ${CF_DB_USER}
    password: ${CF_DB_PASSWORD}
  data:
    redis:
      host: ${CF_REDIS_HOST:127.0.0.1}
      port: ${CF_REDIS_PORT:6379}
      password: ${CF_REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${CF_KAFKA_BOOTSTRAP:127.0.0.1:9092}
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    enabled: true
server:
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,admission
springdoc:
  swagger-ui:
    path: /docs
commerceflow:
  token-lifetime: PT15M
  rate-limit:
    enabled: ${CF_RATE_LIMIT_ENABLED:false}
  messaging:
    enabled: ${CF_MESSAGING_ENABLED:false}
