name: CommerceFlow verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_DB_NAME: commerceflow
      CF_DB_USER: commerceflow
      CF_DB_PASSWORD: ci-only-database-fixture
      CF_DB_ROOT_PASSWORD: ci-only-root-fixture
      CF_BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      CF_BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          mvn -version
          docker version
          docker compose version
      - name: Unit and real MySQL Kafka integration tests
        run: mvn -B --no-transfer-progress verify
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start local application containers
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Check running application
        run: |
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:8080/actuator/health/readiness
          curl --fail --silent http://localhost:8080/api/products
      - name: Exercise orders over real HTTP
        run: python3 scripts/smoke-orders.py
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable containers
        if: always()
        run: docker compose down --volumes
